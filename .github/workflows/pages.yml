# The "try it" build on GitHub Pages: https://kimagedon.github.io/eve-tools-for-comfyui/
# Extend, Light and Cameras run in the browser (ONNX Runtime from public/ort,
# copied there by `npm ci`'s postinstall); sample sets open pre-rendered from
# public/samples. Rendering a new setup needs a ComfyUI server (the server pill).
# Repository settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Check the build carries the runtime and the sample sets
        run: |
          test -s dist/index.html
          test -s dist/ort/ort.min.mjs
          test -s dist/ort/ort-wasm-simd-threaded.jsep.mjs
          test -s dist/ort/ort-wasm-simd-threaded.jsep.wasm
          ls dist/examples/*.jpg
          du -sh dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
